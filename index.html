<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Tool Lấy Match ID</title>
    <style>
        body { background: #0f0f0f; color: #00ff00; font-family: monospace; padding: 20px; }
        .card { border: 1px solid #00ff00; padding: 10px; margin: 10px 0; background: #1a1a1a; }
        button { cursor: pointer; background: #00ff00; border: none; padding: 5px 10px; }
    </style>
</head>
<body>
    <h1>Danh sách trận đấu</h1>
    <div id="app">Đang tải...</div>

    <script>
        async function init() {
            const app = document.getElementById('app');
            try {
                // Gọi tới proxy của chính bạn
                const res = await fetch('/api/proxy');
                const data = await res.json();
                
                app.innerHTML = data.map(m => `
                    <div class="card">
                        <strong>${m.home_name || 'Home'} vs ${m.away_name || 'Away'}</strong><br>
                        <span>ID: ${m.match_id}</span><br>
                        <button onclick="getStream('${m.match_id}')">Lấy Link JSON</button>
                    </div>
                `).join('');
            } catch (e) {
                app.innerHTML = "Lỗi kết nối: " + e.message;
            }
        }

        async function getStream(matchId) {
            const url = `https://thapcamtv2026a.com/app/uploads/match-streamers/${matchId}.json?t=${Date.now()}`;
            alert("Đang gọi: " + url);
            // Dữ liệu này trực tiếp từ thapcam, nếu vẫn bị CORS, bạn cần thêm proxy thứ 2
            window.open(url, '_blank');
        }

        init();
    </script>
</body>
</html>
